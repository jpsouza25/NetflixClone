<ion-header class="ion-no-border">
</ion-header>

<ion-content fullscreen class="login-content">

  <div class="logo-container">
    <img src="assets/img/netflix2.png" class="logo" />
  </div>

  <form (ngSubmit)="login()" class="login-form">

    <ion-item lines="none" class="login-input">
      <ion-input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="login-input">
      <ion-input
        type="password"
        placeholder="Senha"
        [(ngModel)]="password"
        name="password"
        required
      ></ion-input>
    </ion-item>

    <ion-button
      expand="block"
      shape="round"
      color="danger"
      class="login-button"
      type="submit"
    >
      Entrar
    </ion-button>

  </form>

  <div class="signup-text">
    <p>Não possui conta? <span (click)="goToRegister()">Criar conta</span></p>
  </div>

</ion-content>
