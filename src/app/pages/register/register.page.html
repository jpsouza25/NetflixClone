<ion-content class="register-content">

  <div class="logo-area">
    <img src="assets/img/netflix.png" alt="Logo" class="logo">
  </div>

  <div class="form-box">

    <h2 class="title">Criar conta</h2>

    <ion-item fill="outline">
      <ion-input
        type="text"
        placeholder="Nome"
        [(ngModel)]="name">
      </ion-input>
    </ion-item>

    <ion-item fill="outline">
      <ion-input
        type="email"
        placeholder="E-mail"
        [(ngModel)]="email">
      </ion-input>
    </ion-item>

    <ion-item fill="outline">
      <ion-input
        type="password"
        placeholder="Senha"
        [(ngModel)]="password">
      </ion-input>
    </ion-item>

    <ion-button expand="block" shape="round" (click)="register()">
      Criar Conta
    </ion-button>

    <p class="login-link">
      Já tem conta?
      <a (click)="goToLogin()">Entrar</a>
    </p>

  </div>

</ion-content>
