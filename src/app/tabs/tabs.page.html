<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="{{ tabs?.getSelected() === 'home' ? 'home' : 'home-outline' }}"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>
     <ion-tab-button tab="usuario" href="/tabs/usuario">
      <ion-icon name="{{ tabs?.getSelected() === 'usuario' ? 'person' : 'person-outline' }}"></ion-icon>
      <ion-label>Usuario</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
